<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ChainClear Token Sale | Buy CLR Tokens</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --clr-blue: rgba(0, 123, 255, 0.7);
                --clr-white: #fff;
                --clr-dark: #0a192f;
                --clr-accent: #00eaff;
                --font-main: 'Orbitron', Arial, sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: var(--font-main);
                background: linear-gradient(135deg, var(--clr-dark) 0%, var(--clr-blue) 100%);
                color: var(--clr-white);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
            }
            .back-link {
                position: fixed;
                top: 2rem;
                left: 2rem;
                color: var(--clr-accent);
                text-decoration: none;
                font-weight: 700;
                font-size: 1.1rem;
                transition: all 0.3s;
                z-index: 1000;
            }
            .back-link:hover {
                color: var(--clr-white);
                text-shadow: 0 0 10px var(--clr-accent);
                transform: translateX(-5px);
            }
            .container-wrapper {
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
            }
            .card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(15px);
                border: 2px solid rgba(0, 234, 255, 0.3);
                border-radius: 24px;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                overflow: hidden;
                transition: all 0.3s;
            }
            .card:hover {
                box-shadow: 0 12px 48px 0 rgba(0, 234, 255, 0.4);
                transform: translateY(-5px);
            }
            .card-header {
                background: linear-gradient(135deg, rgba(0, 234, 255, 0.3), rgba(0, 123, 255, 0.3));
                border-bottom: 2px solid rgba(255, 255, 255, 0.2);
                padding: 2rem;
                text-align: center;
            }
            .card-header h3 {
                margin: 0;
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: 2px;
            }
            .card-header p {
                margin: 0.5rem 0 0 0;
                font-size: 1.1rem;
                opacity: 0.9;
            }
            .card-body {
                padding: 2rem;
            }
            .btn {
                border-radius: 12px;
                padding: 1rem;
                font-size: 1.1rem;
                font-weight: 700;
                transition: all 0.3s;
                border: none;
                letter-spacing: 1px;
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--clr-accent), #00bcd4);
                color: var(--clr-dark);
                box-shadow: 0 4px 15px rgba(0, 234, 255, 0.4);
            }
            .btn-primary:hover {
                background: linear-gradient(135deg, #00bcd4, var(--clr-blue));
                color: var(--clr-white);
                box-shadow: 0 6px 20px rgba(0, 234, 255, 0.6);
                transform: translateY(-2px);
            }
            .btn-success {
                background: linear-gradient(135deg, #4caf50, #45a049);
                border: none;
                font-weight: 700;
                box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            }
            .btn-success:hover {
                background: linear-gradient(135deg, #45a049, #3d8b40);
                box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
                transform: translateY(-2px);
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none !important;
            }
            .form-control {
                background: rgba(255, 255, 255, 0.1);
                border: 2px solid rgba(0, 234, 255, 0.3);
                border-radius: 12px;
                color: var(--clr-white);
                padding: 0.75rem 1rem;
                font-size: 1.1rem;
                font-family: var(--font-main);
                transition: all 0.3s;
            }
            .form-control:focus {
                background: rgba(255, 255, 255, 0.15);
                border-color: var(--clr-accent);
                box-shadow: 0 0 15px rgba(0, 234, 255, 0.5);
                color: var(--clr-white);
                outline: none;
            }
            .form-label {
                font-weight: 600;
                margin-bottom: 0.75rem;
                font-size: 1.05rem;
                color: var(--clr-accent);
            }
            .form-text {
                color: rgba(255, 255, 255, 0.7);
                margin-top: 0.5rem;
                font-size: 0.95rem;
            }
            #walletAddress {
                min-height: 24px;
                color: var(--clr-accent);
                font-weight: 600;
            }
            .alert {
                border-radius: 12px;
                border: none;
                padding: 1rem;
                font-weight: 600;
                animation: slideIn 0.3s ease-out;
            }
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            hr {
                border-color: rgba(255, 255, 255, 0.2);
                margin: 1.5rem 0;
            }
            @media (max-width: 768px) {
                .back-link {
                    top: 1rem;
                    left: 1rem;
                    font-size: 1rem;
                }
                .card-header h3 {
                    font-size: 1.5rem;
                }
                .card-body {
                    padding: 1.5rem;
                }
            }
        </style>
    </head>

    <body>
        <a href="landing.html" class="back-link">← Back to ChainClear</a>
        
        <div class="container-wrapper">
            <div class="card">
                <div class="card-header">
                    <h3>ChainClear Token Sale</h3>
                    <p>Buy CLR Tokens</p>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <button id="connectWalletBtn" class="btn btn-primary w-100">Connect Wallet</button>
                        <p id="walletAddress" class="text-center mt-2 small"></p>
                    </div>
                    <hr>
                    <div class="mb-4">
                        <label for="ethAmount" class="form-label">ETH of Tokens to Buy:</label>
                        <input type="number" id="ethAmount" class="form-control" min="1" value="1"/>
                        <div class="form-text">1 ETH = 1 CLR</div>
                    </div>
                    <div class="mb-3">
                        <button id="buyTokenBtn" class="btn btn-success w-100" disabled>Buy Tokens</button>
                        <div id="statusMessage" class="mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
        <script type="module" src="index.js"></script>
    </body>
</html>
